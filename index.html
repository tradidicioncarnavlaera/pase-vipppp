<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pase VIP - Tradición Carnavalera</title>  <!-- Fuentes estilo afiche carnavalero -->  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d4005c;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* Fondo tipo afiche */
    .bg-pattern {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, #ffde59 0 8%, transparent 9%),
        radial-gradient(circle at 80% 30%, #00e5ff 0 7%, transparent 8%),
        radial-gradient(circle at 50% 80%, #6cff00 0 6%, transparent 7%);
      opacity: 0.35;
      pointer-events: none;
    }

    .poster {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, #ff006e, #b0004b);
      padding: 45px 55px 55px;
      border-radius: 28px;
      border: 6px solid #ffcc33;
      box-shadow: 0 0 45px rgba(0,0,0,0.4);
      max-width: 420px;
      width: 90%;
      text-align: center;
    }

    .vip {
      font-family: 'Luckiest Guy', cursive;
      font-size: 3.4rem;
      color: white;
      letter-spacing: 3px;
      text-shadow: 4px 4px 0 #ffb000;
    }

    .title {
      margin-top: 10px;
      font-family: 'Luckiest Guy', cursive;
      font-size: 2.6rem;
      color: #ffe066;
      text-shadow: 4px 4px 0 #ff7a00;
    }

    .restricted {
      margin: 20px auto 10px;
      font-size: 1.4rem;
      font-weight: 900;
      color: white;
      background: #e60000;
      display: inline-block;
      padding: 10px 22px;
      border-radius: 16px;
      letter-spacing: 2px;
      box-shadow: 0 0 18px rgba(255,0,0,0.7);
    }

    .date {
      margin-top: 16px;
      font-size: 1.3rem;
      color: white;
    }

    /* Código de barras */
    .scanner-wrap {
      margin-top: 30px;
      background: #fff;
      padding: 18px 16px 26px;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .barcode {
      height: 90px;
      background:
        repeating-linear-gradient(
          90deg,
          #000 0 3px,
          transparent 3px 6px,
          #000 6px 8px,
          transparent 8px 12px,
          #000 12px 16px,
          transparent 16px 20px
        );
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(0,255,0,0.9);
      box-shadow: 0 0 15px rgba(0,255,0,0.9);
      animation: scan 2.5s linear infinite;
    }

    @keyframes scan {
      from { top: 0; }
      to { top: 100%; }
    }

    .scan-text {
      margin-top: 10px;
      font-size: 0.9rem;
      letter-spacing: 3px;
      font-weight: 700;
      color: #333;
    }

    @media (max-width: 600px) {
      .vip { font-size: 2.6rem; }
      .title { font-size: 2.1rem; }
    }
  </style></head>
<body>  <div class="bg-pattern"></div>  <div class="poster">
    <div class="vip">PASE V.I.P</div>
    <div class="title">TRADICIÓN CARNAVALERA</div><div class="restricted">ACCESO RESTRINGIDO</div>
<div class="date">15/02/2026</div>

<div class="scanner-wrap">
  <div class="barcode"></div>
  <div class="scan-line"></div>
  <div class="scan-text">ESCANEANDO ACCESO...</div>
</div>

  </div></body>
</html>
