<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pase VIP - Tradición Carnavalera</title>  <!-- Fuente estilo carnaval (inspirada, no idéntica) -->  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@700&display=swap" rel="stylesheet">  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #ff2f92, #b3004f);
      font-family: 'Baloo 2', sans-serif;
      overflow: hidden;
    }

    /* Figuras decorativas */
    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.25;
      animation: float 6s ease-in-out infinite alternate;
    }

    .s1 { width: 140px; height: 140px; background: yellow; top: 8%; left: 10%; }
    .s2 { width: 90px; height: 90px; background: cyan; bottom: 15%; right: 12%; }
    .s3 { width: 60px; height: 60px; background: lime; top: 20%; right: 25%; }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.1);
      padding: 45px 60px;
      border-radius: 26px;
      text-align: center;
      backdrop-filter: blur(6px);
      border: 4px solid #ffd84d;
      box-shadow: 0 0 35px rgba(255, 216, 77, 0.7);
    }

    .vip {
      font-family: 'Luckiest Guy', cursive;
      font-size: 3.2rem;
      color: white;
      letter-spacing: 3px;
      text-shadow: 3px 3px 0 #ffb000;
    }

    .title {
      margin-top: 10px;
      font-family: 'Luckiest Guy', cursive;
      font-size: 2.6rem;
      color: #ffe066;
      text-shadow: 3px 3px 0 #ff7a00;
    }

    .restricted {
      margin-top: 18px;
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff;
      background: red;
      display: inline-block;
      padding: 8px 18px;
      border-radius: 14px;
      box-shadow: 0 0 15px rgba(255,0,0,0.6);
    }

    .date {
      margin-top: 20px;
      font-size: 1.3rem;
      color: white;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .vip { font-size: 2.4rem; }
      .title { font-size: 2rem; }
      .restricted { font-size: 1.2rem; }
    }
  </style></head>
<body>  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>  <div class="card">
    <div class="vip">PASE V.I.P</div>
    <div class="title">TRADICIÓN CARNAVALERA</div>
    <div class="restricted">ACCESO RESTRINGIDO</div>
    <div class="date">15/02/2026</div>
  </div></body>
</html>
